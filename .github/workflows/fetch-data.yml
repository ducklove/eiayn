name: Refresh ETF Data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 21 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-etf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fetch, validate, and test BEFORE committing anything. If any of these
      # steps fails, the workflow fails without touching the snapshot, so the
      # previously committed (known-good) data keeps serving on Pages.
      - name: Fetch fresh ETF data
        run: npm run data:update

      - name: Validate data snapshot
        run: npm run check:data

      - name: Run tests
        run: npm test

      - name: Commit refreshed snapshot
        id: commit
        run: |
          if git diff --quiet -- public/data/etfs.json; then
            echo "No data changes; skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/etfs.json
            git commit -m "Refresh ETF data snapshot (auto)"
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the default GITHUB_TOKEN intentionally do NOT trigger
      # push-event workflows (GitHub's anti-recursion safeguard), so the
      # snapshot commit above would never start deploy-pages.yml on its own.
      # We must dispatch the Pages deployment explicitly.
      - name: Trigger Pages deployment
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
