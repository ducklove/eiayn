    />
    <title>ETF is All You Need</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a light flash.
      try {
        var eiaynTheme = JSON.parse(localStorage.getItem('eiayn:theme:v1'));
        if (eiaynTheme !== 'dark' && eiaynTheme !== 'light') {
          eiaynTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = eiaynTheme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
